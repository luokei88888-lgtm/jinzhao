name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 应用是 Windows 桌面程序，Rust 侧依赖 Tauri 的 Windows 后端，
    # 所以在 Windows 上跑而不是 Linux。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 前端单元测试
        run: npm test

      - name: 类型检查与前端构建
        run: npm run build

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml
